services:
  api:
    build:
      context: .
      target: api
    image: ids-api
    ports:
      - "8000:8000"
    environment:
      VALIDATION_STATUS: ${VALIDATION_STATUS:-422}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  monitor:                      # régénère le rapport de dérive chaque semaine
    build:
      context: .
      target: monitor
    image: ids-monitor
    command: sh -c "while true; do python -m src.monitoring; sleep 604800; done"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./data:/app/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped