services:
  api:
    build:
      context: .
      target: api
    image: ids-api
    ports:
      - "8000:8000"
    environment:
      VALIDATION_STATUS: ${VALIDATION_STATUS:-422}
      MODEL_PATH: /app/models/model.pkl
      FEATURES_PATH: /app/models/features.json
      PROD_LOG_PATH: /app/data/production/requests.csv
    volumes:
      - ./models:/app/models:ro                       # modèle promu + features.json (fiche du tableau de bord)
      - ./data/production:/app/data/production        # journal des requêtes (lu par le monitoring)
      - ./data/raw:/app/data/raw:ro                   # flux réels du bouton "Charger un flux réel"
      - ./reports:/app/reports:ro                     # état de la dérive affiché dans le tableau de bord
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  monitor:                      # régénère le rapport de dérive chaque semaine
    build:
      context: .
      target: monitor
    image: ids-monitor
    command: sh -c "while true; do python -m src.monitoring; sleep 604800; done"
    environment:
      PROD_LOG_PATH: /app/data/production/requests.csv
    volumes:
      - ./data:/app/data:ro                           # jeu d'entraînement (référence) + journal des requêtes
      - ./reports:/app/reports                        # rapport de dérive écrit ici
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped